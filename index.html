<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Choose Your Cut</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --bg:#0B0E14;
  --text:#EDEAE2;
  --text-dim:#8B93A7;
  --amber:#E8A33D;
  --teal:#4FA8A3;
  --rec:#D6483F;
  --border:rgba(237,234,226,0.10);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  opacity:0.03;
  pointer-events:none;
  z-index:1;
}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;line-height:0.95;}
.mono{font-family:'IBM Plex Mono',monospace;}

.top-bar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:10;
  display:flex;
  justify-content:center;
  padding:22px 0;
  pointer-events:none;
}
.top-bar .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:0.12em;
  color:var(--text-dim);
  display:flex;
  align-items:center;
  gap:8px;
}
.top-bar .eyebrow::before{
  content:"";
  width:7px;height:7px;border-radius:50%;
  background:var(--rec);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.25;}}

.split{
  display:flex;
  height:100vh;
  width:100vw;
}
.panel{
  position:relative;
  flex:1;
  display:flex;
  align-items:flex-end;
  padding:6vw;
  overflow:hidden;
  transition:flex 0.55s cubic-bezier(.22,.61,.36,1);
  cursor:pointer;
}
.split:hover .panel{flex:0.85;}
.split .panel:hover{flex:1.4;}

.panel-design{background:radial-gradient(circle at 30% 20%, rgba(79,168,163,0.15) 0%, rgba(15,26,26,0.8) 40%, var(--bg) 70%);border-right:1px solid var(--border);}
.panel-edit{background:radial-gradient(circle at 70% 20%, rgba(232,163,61,0.15) 0%, rgba(28,23,16,0.8) 40%, var(--bg) 70%);}

.panel-design::after{
  content:"";
  position:absolute;
  top:20%;left:20%;
  width:300px;height:300px;
  background:radial-gradient(circle, rgba(79,168,163,0.2) 0%, transparent 70%);
  filter:blur(60px);
  opacity:0.5;
  transition:opacity 0.5s ease;
}
.panel-edit::after{
  content:"";
  position:absolute;
  top:20%;right:20%;
  width:300px;height:300px;
  background:radial-gradient(circle, rgba(232,163,61,0.2) 0%, transparent 70%);
  filter:blur(60px);
  opacity:0.5;
  transition:opacity 0.5s ease;
}
.panel:hover::after{opacity:0.8;}

.panel-design::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(rgba(79,168,163,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(79,168,163,0.06) 1px, transparent 1px);
  background-size:40px 40px;
  opacity:0.6;
}
.panel-edit::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:radial-gradient(circle, rgba(232,163,61,0.08) 2px, transparent 2.5px);
  background-size:26px 26px;
  opacity:0.6;
}

.panel-content{position:relative;z-index:2;max-width:520px;}
.panel-tag{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  letter-spacing:0.1em;
  margin-bottom:14px;
  display:block;
}
.panel-edit .panel-tag{color:var(--amber);}
.panel-design .panel-tag{color:var(--teal);}

.panel h1{font-size:clamp(34px,6vw,84px);}
.panel p{
  margin-top:16px;
  color:var(--text-dim);
  font-size:15px;
  max-width:34ch;
  line-height:1.6;
}
.panel-arrow{
  margin-top:26px;
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  letter-spacing:0.06em;
  transition:all 0.3s ease;
}
.panel-edit .panel-arrow{color:var(--amber);}
.panel-design .panel-arrow{color:var(--teal);}
.panel-arrow svg{transition:transform 0.4s cubic-bezier(.22,.61,.36,1);}
.panel:hover .panel-arrow svg{transform:translateX(8px);}
.panel:hover .panel-arrow{letter-spacing:0.08em;}

.seam{
  position:absolute;
  top:0;bottom:0;left:50%;
  width:1px;
  background:var(--border);
  z-index:3;
  pointer-events:none;
}

@media(max-width:760px){
  body{overflow-y:auto;overflow-x:hidden;}
  .split{flex-direction:column;height:auto;min-height:100vh;}
  .panel{min-height:50vh;flex:none !important;padding:10vw 8vw;}
  .split:hover .panel{flex:none !important;}
  .panel-edit{border-right:none;border-bottom:1px solid var(--border);}
  .seam{display:none;}
}

@media(prefers-reduced-motion:reduce){
  .panel{transition:none;}
  .top-bar .eyebrow::before{animation:none;}
}
</style>
</head>
<body>

<div class="top-bar"><span class="eyebrow">SELECT YOUR CUT</span></div>

<div class="split">
  <div class="seam"></div>
  <a class="panel panel-design" href="design.html">
    <div class="panel-content">
      <span class="panel-tag mono">01 — PRODUCT &amp; INTERFACE</span>
      <h1>UI &amp; UX<br>Designer</h1>
      <p>Flows, systems, and shipped screens. See the craft.</p>
      <span class="panel-arrow mono">ENTER WORK
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><path d="M1 5H17M17 5L13 1M17 5L13 9" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
    </div>
  </a>
  <a class="panel panel-edit" href="video-editor.html">
    <div class="panel-content">
      <span class="panel-tag mono">02 — MOTION &amp; STILLS</span>
      <h1>Video &amp;<br>Graphic Designer</h1>
      <p>Narrative cuts, brand films, and photo series. See the reel.</p>
      <span class="panel-arrow mono">ENTER REEL
        <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><path d="M1 5H17M17 5L13 1M17 5L13 9" stroke="currentColor" stroke-width="1.4"/></svg>
      </span>
    </div>
  </a>
</div>

</body>
</html>
